name: Test-n-scan

on:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt

      - shell: bash
        run: pytest -rA services/${{ matrix.service }} | tee ${{ matrix.service }}-test-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.service }}-test-report
          path: ${{ matrix.service }}-test-report.txt

